name: Build Android from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'pocketpal-local-llm.zip'
      - '.github/workflows/build-android-from-zip.yml'

env:
  LLAMA_CPP_REF: master
  NDK_VERSION: '28.1.13356709'
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf workspace
          mkdir workspace
          unzip -q pocketpal-local-llm.zip -d workspace
          test -f workspace/package.json
          test -d workspace/android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Install npm dependencies
        working-directory: workspace
        run: npm install

      - name: Fetch llama.cpp
        working-directory: workspace
        run: |
          mkdir -p third_party
          git clone https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          cd third_party/llama.cpp
          git checkout "${LLAMA_CPP_REF}"

      - name: Build web
        working-directory: workspace
        run: npm run build:web

      - name: Copy web assets
        working-directory: workspace
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -R dist/. android/app/src/main/assets/public/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: workspace/android
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          gradle wrapper --gradle-version 8.10
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: localpal-debug-apk
          path: workspace/android/app/build/outputs/apk/debug/app-debug.apk

