name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Setup Java (necessário para Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Instalar dependências
      - name: Install dependencies
        run: |
          # Tenta yarn primeiro (packageManager do package.json aponta yarn)
          if [ -f "yarn.lock" ]; then
            npm install -g yarn
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install -g yarn
            yarn install
          fi

      # 6. Expo Prebuild (gera arquivos nativos Android)
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      # 7. Build do APK (Release)
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 8. Upload do APK como artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # 9. (Opcional) Criar Release no GitHub
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            🚀 Nova versão do OnDevice AI

            - Build automático via GitHub Actions
            - APK pronto para instalação

            **Como instalar:**
            1. Baixe o APK
            2. No Android, habilite "Fontes desconhecidas"
            3. Instale o APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
